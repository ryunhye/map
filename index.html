  var NS = 'http://www.w3.org/2000/svg';

  // map image: fit to window with a small margin
  var IMG_W = 1600, IMG_H = 1302;
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight, m = 0.94;
    var s = Math.min(vw * m / IMG_W, vh * m / IMG_H);
    var w = IMG_W * s, h = IMG_H * s;
    mapEl.setAttribute('x', (vw - w) / 2);
    mapEl.setAttribute('y', (vh - h) / 2);
    mapEl.setAttribute('width', w);
    mapEl.setAttribute('height', h);
    base = Math.max(90, Math.min(vw, vh) * 0.16);
  }
  var base = 120;

  // trailing circles: the lag + blur/contrast filter makes them merge like a liquid blob
  var N = 7, dots = [];
  for (var i = 0; i < N; i++) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('fill', '#fff');
    c.setAttribute('r', 0);
    blobsG.appendChild(c);
    dots.push({ el: c, x: -500, y: -500, r: 0, ease: 0.28 - i * 0.032, size: 1 - i * 0.09 });
  }

  var mx = -500, my = -500, inside = false, started = false;

  function move(e) {
    mx = e.clientX; my = e.clientY;
    if (!started) { dots.forEach(function (d) { d.x = mx; d.y = my; }); started = true; }
    inside = true;
    hint.classList.add('gone');
  }
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', function () { inside = false; });
  svg.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') inside = false; });

  var t = 0;
  function tick() {
    t += 0.03;
    for (var i = 0; i < N; i++) {
      var d = dots[i];
      d.x += (mx - d.x) * d.ease;
      d.y += (my - d.y) * d.ease;
      // gentle breathing so the edge feels alive
      var target = inside ? base * d.size * (1 + 0.08 * Math.sin(t + i)) : 0;
      d.r += (target - d.r) * 0.14;
      d.el.setAttribute('cx', d.x);
      d.el.setAttribute('cy', d.y);
      d.el.setAttribute('r', Math.max(0, d.r));
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', layout);
  layout();
  tick();
})();
</script>
</body>
</html>
